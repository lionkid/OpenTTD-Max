name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  grf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nml==0.9.0 pillow numpy
      - run: make check
      - run: make grf
      - run: make test-grf
      - uses: actions/upload-artifact@v4
        with:
          name: grf
          path: |
            max-air.grf
            max-rail.grf
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            max-air.grf
            max-rail.grf
