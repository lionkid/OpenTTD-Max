  <line x1="340" y1="203" x2="340" y2="217" fill="none" stroke="#5B6764" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="380" y1="203" x2="380" y2="217" fill="none" stroke="#5B6764" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="420" y1="203" x2="420" y2="217" fill="none" stroke="#5B6764" stroke-width="1.2" stroke-linecap="butt"/>
