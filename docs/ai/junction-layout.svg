  <line x1="140" y1="170" x2="780" y2="170" fill="none" stroke="#1B2421" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="140" y1="210" x2="780" y2="210" fill="none" stroke="#1B2421" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="747,170 733,164.75 733,175.25" fill="#1B2421"/>
  <polygon points="693,210 707,204.75 707,215.25" fill="#1B2421"/>
  <text x="790" y="175" font-size="12" font-weight="400" text-anchor="start" fill="#1B2421">往 B</text>
  <text x="790" y="215" font-size="12" font-weight="400" text-anchor="start" fill="#1B2421">從 B</text>
  <line x1="200" y1="163" x2="200" y2="177" fill="none" stroke="#5B6764" stroke-width="1.2" stroke-linecap="butt"/>
