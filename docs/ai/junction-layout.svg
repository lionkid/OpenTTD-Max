  <line x1="30" y1="40" x2="70" y2="40" fill="none" stroke="#1B2421" stroke-width="3.5" stroke-linecap="round"/>
  <text x="80" y="45" font-size="12" font-weight="400" text-anchor="start" fill="#1B2421">既有路線（複線）</text>
  <line x1="220" y1="40" x2="260" y2="40" fill="none" stroke="#0F6B66" stroke-width="3.5" stroke-linecap="round"/>
  <text x="270" y="45" font-size="12" font-weight="400" text-anchor="start" fill="#1B2421">新路線</text>
  <rect x="20" y="148" width="120" height="84" rx="4" fill="#E2EBE7" stroke="#5B6764" stroke-width="1"/>
