  <text x="790" y="315" font-size="12" font-weight="400" text-anchor="start" fill="#0F6B66">從 C</text>
  <line x1="300" y1="158" x2="300" y2="112" fill="none" stroke="#5B6764" stroke-width="1" stroke-linecap="butt"/>
  <text x="294" y="104" font-size="12" font-weight="400" text-anchor="middle" fill="#1B2421">分岔：道岔設在直線段，前後各 2 格直線</text>
  <line x1="440" y1="222" x2="380" y2="272" fill="none" stroke="#5B6764" stroke-width="1" stroke-linecap="butt"/>
  <text x="374" y="288" font-size="12" font-weight="400" text-anchor="end" fill="#1B2421">匯流：同樣的直線條件</text>
  <text x="30" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#5B6764">道岔接在彎道旁會形成 90° 轉向，列車不能通過；新路線從既有軌道旁的空地接入，要跨過既有複線時用橋。</text>
</svg>
