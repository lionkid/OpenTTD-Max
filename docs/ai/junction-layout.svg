  <polyline points="300,170 340,130 580,130 600,150 600,230 640,270 780,270" fill="none" stroke="#0F6B66" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="600" y1="156" x2="600" y2="224" fill="none" stroke="#FBFCFB" stroke-width="14" stroke-linecap="butt"/>
  <line x1="600" y1="150" x2="600" y2="230" fill="none" stroke="#0F6B66" stroke-width="3.5" stroke-linecap="butt"/>
